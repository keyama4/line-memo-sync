name = "line-memo-sync"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV の id は `wrangler kv namespace create <NAME>` の出力に置き換える
kv_namespaces = [
  { binding = "LINE_MESSAGES", id = "c7de392728d544b6b1a022f72817fca7" },
  { binding = "LINE_USER_MAPPINGS", id = "7927c1e996c7468f807dc33bf5ee0add" },
  { binding = "LINE_PUBLIC_KEYS", id = "f592f3806b694b6abd0f541ec27f5159" }
]

# 台帳。database_id は `wrangler d1 create line-memo-sync-ledger` の出力に置き換える
[[d1_databases]]
binding = "DB"
database_name = "line-memo-sync-ledger"
database_id = "98ccd7f9-2a80-4ecf-be21-2673597b3171"

[vars]
PLUGIN_NAME = "LINE Memo Sync"
# 特典記事（設定手順）の URL。公開後に差し替える
HELP_ARTICLE_URL = ""

# 秘密情報は `wrangler secret put <NAME>` で登録する
# - LINE_CHANNEL_ACCESS_TOKEN
# - LINE_CHANNEL_SECRET
# - ADMIN_KEY（/admin/summary 用）

[observability.logs]
enabled = true

[build]
command = "pnpm build"
cwd = "."
